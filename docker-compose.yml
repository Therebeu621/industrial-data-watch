services:
  postgres:
    image: postgres:16
    container_name: industrial-data-watch-db
    environment:
      POSTGRES_DB: ${DB_NAME:-industrial_watch}
      POSTGRES_USER: ${DB_USER:-industrial_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-industrial_pass}
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industrial_user -d industrial_watch"]
      interval: 5s
      timeout: 5s
      retries: 10
